<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05070A">
  <meta name="description" content="MATRIZIA — O futebol, agora conectado.">
  <title>MATRIZIA | O futebol, agora conectado.</title>
  <style>
    :root {
      --bg: #05070a;
      --surface: #0c1117;
      --surface-2: #111820;
      --white: #f2f5f7;
      --muted: #aab4bd;
      --blue: #00a8ff;
      --red: #ff1744;
      --ease-out: cubic-bezier(.23, 1, .32, 1);
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--white);
      background: var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a { color: inherit; text-decoration: none; }
    button, a { -webkit-tap-highlight-color: transparent; }

    .page {
      position: relative;
      isolation: isolate;
      width: 100%;
      min-height: 100vh;
      overflow: hidden;
      padding: clamp(42px, 8vw, 96px) 20px 34px;
      background:
        radial-gradient(ellipse at 50% 32%, rgba(12, 26, 42, .34), transparent 43%),
        linear-gradient(180deg, #05070a 0%, #06090d 60%, #05070a 100%);
    }

    .page::before,
    .page::after {
      content: "";
      position: absolute;
      z-index: -1;
      width: 78vw;
      height: 42vw;
      min-width: 560px;
      min-height: 300px;
      border-radius: 50%;
      pointer-events: none;
      opacity: .8;
      filter: blur(.2px);
    }

    .page::before {
      top: -28vw;
      left: -26vw;
      border-top: 1px solid rgba(0, 168, 255, .95);
      box-shadow: 0 -1px 13px rgba(0, 168, 255, .42), inset 0 -2px 12px rgba(0, 168, 255, .2);
      transform: rotate(-16deg);
    }

    .page::after {
      right: -30vw;
      bottom: -29vw;
      border-bottom: 1px solid rgba(255, 23, 68, .9);
      box-shadow: 0 1px 15px rgba(255, 23, 68, .38), inset 0 2px 12px rgba(255, 23, 68, .16);
      transform: rotate(-15deg);
    }

    .ambient {
      position: absolute;
      z-index: -1;
      top: -5vh;
      right: -10vw;
      width: 36vw;
      min-width: 190px;
      height: 35vh;
      min-height: 260px;
      border-right: 1px solid rgba(255, 23, 68, .7);
      border-radius: 0 100% 0 0;
      transform: rotate(24deg);
      box-shadow: 8px 0 13px rgba(255, 23, 68, .35);
      pointer-events: none;
    }

    .shell {
      width: min(100%, 760px);
      min-height: calc(100vh - 76px);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .brand {
      width: min(100%, 620px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .logo-wrap {
      width: clamp(118px, 24vw, 184px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      margin-bottom: 12px;
      border-radius: 50%;
      overflow: hidden;
      background: #05070a;
    }

    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .brand-name,
    .footer-name {
      margin: 0;
      font-weight: 760;
      letter-spacing: .32em;
      line-height: 1;
      text-transform: uppercase;
    }

    .brand-name { font-size: clamp(1.55rem, 5vw, 2.55rem); }

    .headline {
      margin: clamp(35px, 6vw, 58px) 0 0;
      font-size: clamp(1.18rem, 4vw, 2rem);
      line-height: 1.18;
      letter-spacing: .13em;
      font-weight: 760;
      text-transform: uppercase;
    }

    .description {
      max-width: 620px;
      margin: 20px auto 0;
      color: var(--muted);
      font-size: clamp(.94rem, 2.8vw, 1.25rem);
      line-height: 1.48;
      letter-spacing: .025em;
    }

    .divider {
      position: relative;
      width: min(70%, 310px);
      height: 2px;
      margin: clamp(38px, 7vw, 64px) auto 28px;
      background: linear-gradient(90deg, transparent 0%, var(--blue) 42%, var(--blue) 50%, var(--red) 58%, transparent 100%);
      box-shadow: 0 0 10px rgba(0, 168, 255, .62), 0 0 11px rgba(255, 23, 68, .35);
    }

    .divider::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 52px;
      height: 5px;
      transform: translate(-50%, -50%);
      border-radius: 99px;
      background: linear-gradient(90deg, var(--blue), var(--blue), var(--red));
      box-shadow: 0 0 13px rgba(0, 168, 255, .72), 0 0 11px rgba(255, 23, 68, .5);
    }

    .links {
      width: min(100%, 690px);
      display: grid;
      gap: 18px;
    }

    .link-card {
      --edge: linear-gradient(90deg, rgba(0, 168, 255, .95), rgba(0, 168, 255, .72) 52%, rgba(255, 23, 68, .86));
      position: relative;
      display: grid;
      grid-template-columns: 56px 1fr 24px;
      align-items: center;
      min-height: 91px;
      padding: 14px 22px;
      overflow: hidden;
      border: 1px solid transparent;
      border-radius: 22px;
      background: linear-gradient(var(--surface), var(--surface)) padding-box, var(--edge) border-box;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.035), 0 12px 28px rgba(0,0,0,.18);
      transition: transform 160ms var(--ease-out), box-shadow 220ms var(--ease-out), background 220ms var(--ease-out);
    }

    .link-card::before {
      content: "";
      position: absolute;
      inset: -2px auto -2px -55%;
      width: 38%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.1), transparent);
      transform: skewX(-18deg);
      opacity: 0;
      transition: left 500ms var(--ease-out), opacity 200ms ease;
    }

    .link-card:hover,
    .link-card:focus-visible {
      transform: translateY(-2px);
      background: linear-gradient(var(--surface-2), var(--surface-2)) padding-box, var(--edge) border-box;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 14px 34px rgba(0, 0, 0, .28), 0 0 18px rgba(0, 168, 255, .1);
      outline: none;
    }

    .link-card:hover::before,
    .link-card:focus-visible::before { left: 125%; opacity: 1; }

    .link-card:active { transform: scale(.985); }

    .link-card.primary {
      --edge: linear-gradient(90deg, #00a8ff, #42c5ff 50%, #00a8ff);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 0 21px rgba(0, 168, 255, .23), 0 15px 34px rgba(0, 0, 0, .2);
    }

    .icon {
      width: 38px;
      height: 38px;
      color: var(--white);
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .label {
      text-align: center;
      font-size: clamp(1rem, 3.2vw, 1.42rem);
      line-height: 1;
      letter-spacing: .16em;
      font-weight: 760;
      text-transform: uppercase;
    }

    .arrow {
      justify-self: end;
      color: var(--white);
      font-size: 2rem;
      font-weight: 300;
      line-height: 1;
      transform: translateY(-1px);
    }

    .footer {
      margin-top: auto;
      padding-top: clamp(62px, 11vw, 106px);
      text-align: center;
    }

    .footer-name { font-size: clamp(1.15rem, 3.5vw, 1.7rem); }
    .footer-tagline {
      margin: 20px 0 0;
      color: var(--white);
      font-size: clamp(.64rem, 2vw, .84rem);
      letter-spacing: .32em;
      line-height: 1.4;
      text-transform: uppercase;
    }

    @media (max-width: 520px) {
      .page { padding-inline: 15px; }
      .link-card { min-height: 76px; padding-inline: 15px; border-radius: 17px; grid-template-columns: 44px 1fr 18px; }
      .icon { width: 31px; height: 31px; }
      .label { letter-spacing: .1em; }
      .arrow { font-size: 1.65rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
